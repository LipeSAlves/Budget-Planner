

services:
  postgres:
    image: postgres:16-alpine

    container_name: budget-planner-db

    restart: unless-stopped

    ports:
      - "5434:5432"

    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    volumes:
      - budget_planner_data:/var/lib/postgresql/data

volumes:
  budget_planner_data:
